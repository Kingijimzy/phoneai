<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="dark">
<style>
:root{color-scheme:dark;--blue:#56baff;--ice:#b9e6ff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#f4f7fb;font-family:system-ui,-apple-system,Arial,sans-serif}
#stage{position:absolute;inset:0;background:#000;overflow:hidden}
canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
#ambient{pointer-events:none;position:absolute;inset:0;background:radial-gradient(ellipse 38% 40% at 50% 43%,#07518b20 0%,#03223b0d 46%,transparent 76%)}
#headGlow{pointer-events:none;position:absolute;width:min(82vw,520px);height:min(82vw,520px);left:50%;top:43%;transform:translate(-50%,-50%);border-radius:50%;background:#087ed0;filter:blur(95px);opacity:.09;transition:opacity .5s ease}
#wave{position:absolute;left:0;right:0;bottom:20%;height:100px;width:100%;opacity:.72;pointer-events:none}
#status{position:absolute;top:calc(env(safe-area-inset-top,0px) + 22px);left:0;right:0;text-align:center;font-size:10px;font-weight:600;letter-spacing:.28em;color:#aeb9c8;text-transform:uppercase}
#caption{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 13%);left:16px;right:16px;text-align:center;color:#8e9cad;font-size:12px;letter-spacing:.04em}
#stage[data-state="listening"] #headGlow{opacity:.16}
#stage[data-state="thinking"] #headGlow{opacity:.11}
#stage[data-state="speaking"] #headGlow{opacity:.22}
#stage[data-state="interrupted"] #headGlow{opacity:.04}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="stage" data-state="idle" aria-label="Orion live hologram">
<canvas id="network" aria-hidden="true"></canvas>
<div id="headGlow"></div><div id="ambient"></div>
<canvas id="wave" aria-hidden="true"></canvas>
<div id="status">ORION · STANDBY</div>
<div id="caption">Ready when you are</div>
</div>
<script>
(()=> {
'use strict';
const stage=document.getElementById('stage'),canvas=document.getElementById('network'),ctx=canvas.getContext('2d',{alpha:false});
const wave=document.getElementById('wave'),wx=wave.getContext('2d');
const status=document.getElementById('status'),caption=document.getElementById('caption');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let w=0,h=0,dpr=1,points=[],state='idle',speech=0,mic=0,frame=0;
const labels={idle:['ORION · STANDBY','Ready when you are'],listening:['LISTENING','I’m listening'],thinking:['THINKING','Give me a moment'],speaking:['ORION · SPEAKING',''],interrupted:['PAUSED','I’m here'],disconnected:['RECONNECTING','Voice connection interrupted']};
function insideHead(x,y){
 const skull=((x-.5)/.205)**2+((y-.34)/.205)**2;
 const jawX=(x-.5)/(.105+Math.max(0,y-.37)*.36);
 const jaw=jawX*jawX+((y-.49)/.17)**2;
 const neckX=(x-.5)/.075,neck=neckX*neckX+((y-.625)/.12)**2;
 const shoulder=((x-.5)/.32)**2+((y-.76)/.19)**2;
 return (skull<1&&y<.47)||(jaw<1&&y>=.36&&y<.62)||(neck<1&&y>.56&&y<.72)||(shoulder<1&&y>.67);
}
function resize(){
 dpr=Math.min(window.devicePixelRatio||1,2);w=window.innerWidth;h=window.innerHeight;
 for(const c of [canvas,wave]){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);c.style.width=w+'px';c.style.height=h+'px';}
 ctx.setTransform(dpr,0,0,dpr,0,0);wx.setTransform(dpr,0,0,dpr,0,0);
 points=[];const scale=Math.min(w,h),step=Math.max(6,Math.min(9,scale/65));
 const cols=Math.ceil(w/step),rows=Math.ceil(h/step);
 for(let gy=0;gy<rows;gy++)for(let gx=0;gx<cols;gx++){
  const x=(gx+.5)/cols,y=(gy+.5)/rows;
  if(insideHead(x,y)&&Math.random()>.16)points.push({x:x*w,y:y*h,baseX:x*w,baseY:y*h,phase:Math.random()*6.28,seed:Math.random(),energy:.3+Math.random()*.7});
 }
}
function setState(next,detail){
 if(typeof next==='string')state=next.toLowerCase();
 else if(next&&typeof next==='object')state=String(next.state||next.mode||state).toLowerCase();
 if(!labels[state])state=state.includes('listen')?'listening':state.includes('think')?'thinking':state.includes('speak')?'speaking':state.includes('interrupt')?'interrupted':state.includes('disconnect')?'disconnected':'idle';
 stage.dataset.state=state;status.textContent=labels[state][0];caption.textContent=(detail&&typeof detail==='string')?detail:labels[state][1];
 if(state==='speaking')speech=Math.max(speech,.65);
}
function drawHead(t){
 ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);
 const cx=w*.5,cy=h*.43,scale=Math.min(w,h),motion=reduced?0:1;
 const glow=ctx.createRadialGradient(cx,cy,scale*.025,cx,cy,scale*.34);
 glow.addColorStop(0,state==='speaking'?'#07365b35':'#062b4a20');glow.addColorStop(1,'#00000000');
 ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);
 // A flat, 2D particle-network silhouette. No 3D model, mesh, or external CDN.
 for(let i=0;i<points.length;i++){
  const p=points[i],x=p.baseX+Math.sin(t*.0011+p.phase)*1.7*motion,y=p.baseY+Math.cos(t*.0013+p.phase)*1.4*motion;
  p.x=x;p.y=y;
 }
 const maxDist=Math.max(12,Math.min(19,Math.min(w,h)/38));
 for(let i=0;i<points.length;i++){
  const a=points[i],near=[];
  for(let j=i+1;j<points.length;j++){
   const b=points[j],dx=a.x-b.x,dy=a.y-b.y,d=dx*dx+dy*dy;
   if(d<maxDist*maxDist)near.push([b,d]);
  }
  for(const [b,d] of near){
   const alpha=(1-Math.sqrt(d)/maxDist)*(.14+a.seed*.16);
   ctx.strokeStyle='rgba(70,177,255,'+alpha+')';ctx.lineWidth=.55;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
  }
 }
 for(const p of points){
  const pulse=(Math.sin(t*.002+p.phase)+1)*.5;
  const r=.45+p.energy*.9+(state==='speaking'?pulse*1.2:state==='listening'?mic*.8:0);
  ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);
  ctx.fillStyle='rgba(113,204,255,'+(0.36+p.seed*.56+pulse*.12)+')';ctx.shadowColor='#299eff';ctx.shadowBlur=state==='speaking'?7:3;ctx.fill();ctx.shadowBlur=0;
 }
 // Soft contour edge gives the particle field a recognizable human head/neck shape.
 ctx.save();ctx.globalCompositeOperation='lighter';ctx.strokeStyle='rgba(60,163,255,.13)';ctx.lineWidth=1.2;
 ctx.beginPath();ctx.ellipse(cx,h*.34,w*.205,h*.205,0,Math.PI*1.03,Math.PI*1.97);ctx.stroke();
 ctx.beginPath();ctx.moveTo(cx-w*.18,h*.39);ctx.quadraticCurveTo(cx-w*.16,h*.55,cx-w*.07,h*.61);ctx.lineTo(cx-w*.07,h*.69);
 ctx.moveTo(cx+w*.18,h*.39);ctx.quadraticCurveTo(cx+w*.16,h*.55,cx+w*.07,h*.61);ctx.lineTo(cx+w*.07,h*.69);ctx.stroke();ctx.restore();
}
function drawWave(t){
 const ww=w,hh=100;wx.clearRect(0,0,ww,hh);
 const active=state==='speaking'?Math.max(.24,speech):state==='listening'?Math.max(.12,mic):state==='thinking'?.25:state==='interrupted'?.04:.09;
 for(let line=0;line<3;line++){
  wx.beginPath();for(let x=0;x<=ww;x+=3){
   const n=x/ww,env=Math.sin(Math.PI*n)**.7;
   const amp=(8+line*5)*active;
   const y=hh/2+Math.sin(n*18+ t*.002-line*.8)*amp*env+Math.sin(n*33-t*.0015+line)*amp*.32*env;
   if(x===0)wx.moveTo(x,y);else wx.lineTo(x,y);
  }
  wx.strokeStyle=line===1?'rgba(115,202,255,.65)':'rgba(57,151,224,.24)';wx.lineWidth=line===1?1.4:.8;wx.stroke();
 }
 speech*=.94;mic*=.9;
}
function animate(t){frame++;drawHead(t);drawWave(t);if(!reduced)requestAnimationFrame(animate);}
window.Orion3D={setState,pulse(value){speech=Math.max(speech,Number(value)||.7)},setMicLevel(value){mic=Math.max(mic,Math.min(1,Number(value)||0))},destroy(){state='disconnected';setState('disconnected')}};
window.OrionHologram=window.Orion3D;
window.addEventListener('resize',resize,{passive:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!reduced)requestAnimationFrame(animate)});
resize();requestAnimationFrame(animate);
})();
</script>
</body>
</html>
