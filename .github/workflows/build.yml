name: Build APK

on:
  push:
    branches: [main, feature/phoneai-integrated-character-agent]
  pull_request:
  workflow_dispatch:

# Cancel stale builds on the same ref so every commit does not queue another full
# ~50 MB native-runtime download/build behind obsolete commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Android SDK for pinned PRoot build
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;28.0.12433566'

      - name: Build pinned Android PRoot and stage ABI-specific native runtime
        shell: bash
        run: |
          set -euo pipefail
          git clone --recurse-submodules https://github.com/OpenMinis/OpenMinis.git upstream
          git -C upstream checkout --detach 1a71df0f381cefde80bf912b723de6f9831bc177
          git -C upstream submodule update --init --recursive
          test "$(git -C upstream rev-parse HEAD)" = "1a71df0f381cefde80bf912b723de6f9831bc177"
          mkdir -p upstream/deps/build/proot-android
          curl --fail --location --retry 3 --retry-all-errors https://download.samba.org/pub/talloc/talloc-2.4.2.tar.gz -o upstream/deps/build/proot-android/talloc-2.4.2.tar.gz
          echo "85ecf9e465e20f98f9950a52e9a411e14320bc555fa257d87697b7e7a9b1d8a6  upstream/deps/build/proot-android/talloc-2.4.2.tar.gz" | sha256sum --check -
          mkdir -p upstream/src/android/app/src/main/jniLibs/arm64-v8a
          curl --fail --location --retry 3 --retry-all-errors https://raw.githubusercontent.com/OpenMinis/OpenMinis/1a71df0f381cefde80bf912b723de6f9831bc177/src/android/app/src/main/jniLibs/arm64-v8a/libproot-loader.so -o upstream/src/android/app/src/main/jniLibs/arm64-v8a/libproot-loader.so
          echo "44ef39c1e1a18c09f6e4c4b5d6f8bba82d30596598bd155ec162d05c5122ff04  upstream/src/android/app/src/main/jniLibs/arm64-v8a/libproot-loader.so" | sha256sum --check -
          curl --fail --location --retry 3 --retry-all-errors https://raw.githubusercontent.com/OpenMinis/OpenMinis/1a71df0f381cefde80bf912b723de6f9831bc177/src/android/app/src/main/jniLibs/arm64-v8a/libproot-loader32.so -o upstream/src/android/app/src/main/jniLibs/arm64-v8a/libproot-loader32.so
          echo "25f6bd90bc5a3d3088026289a0d3eaf3e502bd2b00e5cb74fadd9791132efa34  upstream/src/android/app/src/main/jniLibs/arm64-v8a/libproot-loader32.so" | sha256sum --check -
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | sdkmanager --licenses >/dev/null || true
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.12433566"
          bash upstream/deps/build_proot.sh clean
          mkdir -p app/src/main/jniLibs/arm64-v8a
          install -m 0755 upstream/src/android/app/src/main/assets/proot-aarch64 app/src/main/jniLibs/arm64-v8a/libproot.so
          install -m 0755 upstream/src/android/app/src/main/jniLibs/arm64-v8a/libproot-loader.so app/src/main/jniLibs/arm64-v8a/libproot-loader.so
          install -m 0755 upstream/src/android/app/src/main/jniLibs/arm64-v8a/libproot-loader32.so app/src/main/jniLibs/arm64-v8a/libproot-loader32.so
          echo "91c3f3ce38482fba523c0dcbfa5eb883e8aae063236bff3d091da6a58f1c94c4  app/src/main/jniLibs/arm64-v8a/libproot.so" | sha256sum --check -
          echo "44ef39c1e1a18c09f6e4c4b5d6f8bba82d30596598bd155ec162d05c5122ff04  app/src/main/jniLibs/arm64-v8a/libproot-loader.so" | sha256sum --check -
          echo "25f6bd90bc5a3d3088026289a0d3eaf3e502bd2b00e5cb74fadd9791132efa34  app/src/main/jniLibs/arm64-v8a/libproot-loader32.so" | sha256sum --check -
          file app/src/main/jniLibs/arm64-v8a/*

      - name: Test constrained bundled Python policy
        run: python3 -m unittest discover -s app/src/test/python -v

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Test the restricted Python sandbox
        run: python3 tests/python/test_orion_exec.py

      - name: Run unit tests and build debug APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Validate APK package and signature before publishing
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libproot.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libproot-loader.so'
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libproot-loader32.so'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "Application ID and SDK requirements:"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | grep -E "^(package:|sdkVersion:|targetSdkVersion:)"

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneAI-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish the APK as a release (easy download on your phone)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Phone AI build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
