name: fix-agent-chat-truth
on:
  workflow_dispatch:
  push:
    branches: [orion/objective-graph-autonomy-fix]
    paths:
      - ".github/workflows/fix-agent-chat-truth.yml"
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orion/objective-graph-autonomy-fix
      - name: Fix AgentChatActivity
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/phoneai/app/AgentChatActivity.kt")
          t = p.read_text()
          # remove any appendTruthOrText blocks
          while "appendTruthOrText" in t:
              start = t.find("/** Structured truth cards")
              if start < 0:
                  start = t.find("private fun appendTruthOrText")
              if start < 0:
                  break
              # walk back to line start
              line_start = t.rfind("\n", 0, start) + 1
              idx = t.find("container.addView(tv)", start)
              if idx < 0:
                  break
              end = t.find("\n    }\n", idx)
              if end < 0:
                  break
              t = t[:line_start] + t[end + 6:]
              print("removed one helper")
          old = """    private fun addBubble(user: Boolean, text: String): TextView {
        val bubble = TextView(this).apply {
            this.text = if (user) text else Markdown.render(MarkdownTables.flatten(text)); textSize = 14.5f
            if (!user) movementMethod = LinkMovementMethod.getInstance()
            setTextColor(if (user) Theme.ON_ACCENT else Theme.TEXT)
            setTextIsSelectable(true)
            setPadding(dp(14), dp(10), dp(14), dp(10))
            background = GradientDrawable().apply { setColor(if (user) Theme.CYAN else Theme.PANEL); cornerRadius = dp(18).toFloat() }
        }
        val lp = LinearLayout.LayoutParams(-2, -2).apply {
            topMargin = dp(8); gravity = if (user) Gravity.END else Gravity.START
            if (user) marginStart = dp(48) else marginEnd = dp(48)
        }
        messages.addView(bubble, lp)
        Motion.enter(bubble)
        scroll.post { scroll.fullScroll(android.view.View.FOCUS_DOWN) }
        return bubble
    }"""
          new = """    private fun addBubble(user: Boolean, text: String): TextView {
        // Chat truth UI: structured backend notes become cards; never invent progress.
        if (!user) {
            val truth = OrionChatTruthUi.tryBuildCard(this, "note", text)
            if (truth != null) {
                messages.addView(truth, LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(8) })
                Motion.enter(truth)
                scroll.post { scroll.fullScroll(android.view.View.FOCUS_DOWN) }
                return TextView(this).apply { visibility = android.view.View.GONE }
            }
        }
        val bubble = TextView(this).apply {
            this.text = if (user) text else Markdown.render(MarkdownTables.flatten(text)); textSize = 14.5f
            if (!user) movementMethod = LinkMovementMethod.getInstance()
            setTextColor(if (user) Theme.ON_ACCENT else Theme.TEXT)
            setTextIsSelectable(true)
            setPadding(dp(14), dp(10), dp(14), dp(10))
            background = GradientDrawable().apply { setColor(if (user) Theme.CYAN else Theme.PANEL); cornerRadius = dp(18).toFloat() }
        }
        val lp = LinearLayout.LayoutParams(-2, -2).apply {
            topMargin = dp(8); gravity = if (user) Gravity.END else Gravity.START
            if (user) marginStart = dp(48) else marginEnd = dp(48)
        }
        messages.addView(bubble, lp)
        Motion.enter(bubble)
        scroll.post { scroll.fullScroll(android.view.View.FOCUS_DOWN) }
        return bubble
    }"""
          if "OrionChatTruthUi.tryBuildCard(this, \"note\"" not in t and 'OrionChatTruthUi.tryBuildCard(this, "note"' not in t:
              if old not in t:
                  raise SystemExit("addBubble not found")
              t = t.replace(old, new, 1)
              print("wired addBubble")
          else:
              print("addBubble already ok")
          if "appendTruthOrText" in t:
              raise SystemExit("helper still present")
          p.write_text(t)
          print("ok", p.stat().st_size)
          PY
      - name: Commit
        run: |
          git config user.name orion-bot
          git config user.email orion@users.noreply.github.com
          git add app/src/main/java/com/phoneai/app/AgentChatActivity.kt
          git diff --cached --quiet && echo no-change && exit 0
          git commit -m "fix: AgentChat truth UI compile + structured cards"
          git push origin HEAD:orion/objective-graph-autonomy-fix
