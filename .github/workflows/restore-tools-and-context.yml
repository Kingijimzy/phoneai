name: restore-tools-and-context
on:
  workflow_dispatch:
  push:
    branches: [orion/objective-graph-autonomy-fix]
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orion/objective-graph-autonomy-fix
          fetch-depth: 0
      - name: Restore Tools.kt and wire playMedia + Agent context
        run: |
          set -euo pipefail
          git show d43fc14e0ab763c93611160128eab35921ad15d0:app/src/main/java/com/phoneai/app/Tools.kt > app/src/main/java/com/phoneai/app/Tools.kt
          test -s app/src/main/java/com/phoneai/app/Tools.kt
          wc -c app/src/main/java/com/phoneai/app/Tools.kt
          python3 <<'PY'
          from pathlib import Path
          import re
          tools = Path("app/src/main/java/com/phoneai/app/Tools.kt")
          t = tools.read_text()
          if "MediaPlayRouting.play" not in t:
              new_play = "    fun playMedia(query: String, app: String?): String =\n        MediaPlayRouting.play(svc, query, app, ::installed, ::launch)\n"
              m = re.search(r"    fun playMedia\(query: String, app: String\?\): String \{.*?\n    \}\n", t, flags=re.S)
              if not m:
                  raise SystemExit("playMedia not found after restore")
              tools.write_text(t[:m.start()] + new_play + "\n" + t[m.end():])
              print("playMedia delegated")
          agent = Path("app/src/main/java/com/phoneai/app/Agent.kt")
          at = agent.read_text()
          needle = "        // One-intent commands (play music, Google it in Chrome) skip the model entirely.\n        if (!resumeRequest && !browserActionTask && !structuredTask) {\n            val fast = FastIntents.parse(command)"
          insert = "        // Ground every run in live capability/graph context before acting.\n        if (!resumeRequest) {\n            val pre = OrionPreActionContext.assess(svc, command)\n            ui.note(\"[CONTEXT]\\n\" + pre.summary)\n        }\n" + needle
          if "[CONTEXT]" not in at and needle in at:
              at = at.replace(needle, insert, 1)
              print("context gate inserted")
          old = "ui.say(\"I could not create and persist a valid multi-objective graph, so I stopped before executing any objective. No objective is marked complete.\")\n                    return"
          new = "ui.note(\"[TASK:OBJECTIVE] Model graph failed; installing local fallback and continuing.\")\n                    OrionObjectiveGraph.ensureStructuredGraph(svc, inputCommand, sequential = true)\n                        ?: OrionObjectiveGraph.ensureSingleMain(svc, inputCommand)"
          if old in at:
              at = at.replace(old, new, 1)
              print("graph hard-stop softened")
          agent.write_text(at)
          PY
      - name: Commit restore
        run: |
          git config user.name orion-bot
          git config user.email orion@users.noreply.github.com
          git add app/src/main/java/com/phoneai/app/Tools.kt app/src/main/java/com/phoneai/app/Agent.kt
          git status
          git diff --cached --stat
          git commit -m "fix: restore Tools.kt, native media route, pre-action context, graph continue" || echo "nothing to commit"
          git push origin HEAD:orion/objective-graph-autonomy-fix
