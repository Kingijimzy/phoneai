name: patch-orion-routing-and-graph
on:
  workflow_dispatch:
  push:
    branches: [orion/objective-graph-autonomy-fix]
    paths:
      - "app/src/main/java/com/phoneai/app/Tools.kt"
      - ".github/workflows/patch-orion-routing-and-graph.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Native-first playMedia
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          tools = Path("app/src/main/java/com/phoneai/app/Tools.kt")
          tt = tools.read_text()
          if "openOnly" in tt and "OPEN_APP_ONLY" in tt:
              print("already patched")
              raise SystemExit(0)
          m = re.search(r"    fun playMedia\(query: String, app: String\?\): String \{.*?\n    \}\n", tt, flags=re.S)
          if not m:
              raise SystemExit("playMedia not found")
          new_play = '''    fun playMedia(query: String, app: String?): String {
        val openOnly = query == FastIntents.OPEN_APP_ONLY || query.isBlank()
        val wanted = when (app) {
            "spotify" -> "com.spotify.music"
            "youtube music" -> "com.google.android.apps.youtube.music"
            "youtube" -> if (openOnly) "com.google.android.youtube" else null
            else -> listOf(
                "com.google.android.apps.youtube.music",
                "com.spotify.music",
                "com.apple.android.music",
                "com.amazon.mp3"
            ).firstOrNull { installed(it) }
        }
        fun labelOf(pkg: String): String = when {
            pkg.contains("spotify") -> "Spotify"
            pkg.contains("youtube.music") -> "YouTube Music"
            pkg.contains("youtube") -> "YouTube"
            pkg.contains("amazon") -> "Amazon Music"
            else -> "Music"
        }
        if (wanted != null && installed(wanted)) {
            if (openOnly) {
                val launchIntent = svc.packageManager.getLaunchIntentForPackage(wanted)
                if (launchIntent != null) {
                    val r = launch(launchIntent, 300)
                    if (r == "ok") return "opened " + labelOf(wanted) + " app"
                }
            } else {
                val i = Intent(android.provider.MediaStore.INTENT_ACTION_MEDIA_PLAY_FROM_SEARCH)
                    .putExtra(android.app.SearchManager.QUERY, query)
                    .putExtra(android.provider.MediaStore.EXTRA_MEDIA_FOCUS, "vnd.android.cursor.item/*")
                    .setPackage(wanted)
                val r = launch(i, 300)
                if (r == "ok") return "playing $query in " + labelOf(wanted)
                val launchIntent = svc.packageManager.getLaunchIntentForPackage(wanted)
                if (launchIntent != null) {
                    val r2 = launch(launchIntent, 300)
                    if (r2 == "ok") return "opened " + labelOf(wanted) + " (play-from-search unavailable)"
                }
            }
        }
        if (openOnly) {
            return "error: no installed music app found (YouTube Music / Spotify). Install one or name the app."
        }
        val v = Intent(Intent.ACTION_VIEW, Uri.parse("https://www.youtube.com/results?search_query=" + Uri.encode(query)))
        if (installed("com.google.android.youtube")) v.setPackage("com.google.android.youtube")
        val r = launch(v, 300)
        return if (r == "ok") "opened YouTube results for $query" else r
    }
'''
          tools.write_text(tt[:m.start()] + new_play + tt[m.end():])
          print("patched playMedia")
          PY
      - name: Agent hard-stop soft patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/phoneai/app/Agent.kt")
          t = p.read_text()
          if "Local fallback objective graph installed" in t:
              print("agent already ok")
              raise SystemExit(0)
          old = 'ui.say("I could not create and persist a valid multi-objective graph, so I stopped before executing any objective. No objective is marked complete.")\n                    return'
          new = 'ui.note("[TASK:OBJECTIVE] Model graph failed; installing local fallback and continuing.")\n                    OrionObjectiveGraph.ensureStructuredGraph(svc, inputCommand, sequential = true)\n                        ?: OrionObjectiveGraph.ensureSingleMain(svc, inputCommand)'
          if old not in t:
              print("agent marker missing; skip")
              raise SystemExit(0)
          p.write_text(t.replace(old, new, 1))
          print("agent hard-stop replaced")
          PY
      - name: Commit
        run: |
          git config user.name orion-bot
          git config user.email orion@users.noreply.github.com
          git add app/src/main/java/com/phoneai/app/Tools.kt app/src/main/java/com/phoneai/app/Agent.kt || true
          git diff --cached --quiet && echo no-change && exit 0
          git commit -m "fix: native music open + continue after graph plan failure"
          git push
