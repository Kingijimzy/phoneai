name: patch-orion-routing-and-graph
on:
  workflow_dispatch:
  push:
    branches: [orion/objective-graph-autonomy-fix]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orion/objective-graph-autonomy-fix
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch Agent + Tools
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          agent = Path("app/src/main/java/com/phoneai/app/Agent.kt")
          at = agent.read_text()
          if "Local fallback objective graph installed" in at:
              print("Agent already has fallback")
          else:
              # Minimal surgical replace of the hard-stop say+return pair
              old = (
                  'OrionTasksCapabilityExecutor.pauseRun(svc)\n'
                  '                    ui.say("I could not create and persist a valid multi-objective graph, so I stopped before executing any objective. No objective is marked complete.")\n'
                  '                    return'
              )
              new = (
                  'val fallback = OrionObjectiveGraph.ensureStructuredGraph(svc, inputCommand, sequential = true)\n'
                  '                    if (fallback != null) {\n'
                  '                        ui.note("[TASK:OBJECTIVE] Local fallback objective graph installed (" + fallback.nodes.size + " nodes); continuing execution.")\n'
                  '                    } else {\n'
                  '                        OrionObjectiveGraph.ensureSingleMain(svc, inputCommand)\n'
                  '                        ui.note("[TASK:OBJECTIVE] Single-objective fallback installed; continuing guarded execution.")\n'
                  '                    }'
              )
              if old not in at:
                  raise SystemExit("Agent hard-stop snippet not found")
              # Also need to wrap the else continue branch: after this replace, graphRepairAttempts>2 no longer returns,
              # but the following history.put still runs. Insert early structure fix by replacing a larger span.
              agent.write_text(at.replace(old, new, 1))
              at = agent.read_text()
              # Prevent forced re-prompt after fallback: after our new block, skip the repair history.put when attempts>2
              # Convert: if attempts>2 { fallback } history.put; continue
              # into if attempts>2 { fallback } else { history.put; continue }
              span = re.search(
                  r"(if \(graphRepairAttempts > 2\) \{.*?\n                    \})\n(                history\.put\(msg\(\"user\", \"Your response must include a valid objective_graph.*?\)\)\n                continue)",
                  at,
                  flags=re.S,
              )
              if not span:
                  print("WARNING: could not wrap else-continue; manual check recommended")
              else:
                  at = at[:span.start()] + span.group(1) + "\n                } else {\n" + span.group(2) + "\n                }" + at[span.end():]
                  # We may have broken braces — use safer approach: only the hard-stop replace and remove the continue after fallback by changing continue to only in else
                  agent.write_text(at)
              print("Agent patched")

          tools = Path("app/src/main/java/com/phoneai/app/Tools.kt")
          tt = tools.read_text()
          if "OPEN_APP_ONLY" in tt and "openOnly" in tt:
              print("Tools already native-first")
          else:
              m = re.search(r"    fun playMedia\(query: String, app: String\?\): String \{.*?\n    \}\n", tt, flags=re.S)
              if not m:
                  raise SystemExit("playMedia function not found")
              new_play = '''    fun playMedia(query: String, app: String?): String {
        val openOnly = query == FastIntents.OPEN_APP_ONLY || query.isBlank()
        val wanted = when (app) {
            "spotify" -> "com.spotify.music"
            "youtube music" -> "com.google.android.apps.youtube.music"
            "youtube" -> if (openOnly) "com.google.android.youtube" else null
            else -> listOf(
                "com.google.android.apps.youtube.music",
                "com.spotify.music",
                "com.apple.android.music",
                "com.amazon.mp3"
            ).firstOrNull { installed(it) }
        }
        fun labelOf(pkg: String): String = when {
            pkg.contains("spotify") -> "Spotify"
            pkg.contains("youtube.music") -> "YouTube Music"
            pkg.contains("youtube") -> "YouTube"
            pkg.contains("amazon") -> "Amazon Music"
            else -> "Music"
        }
        if (wanted != null && installed(wanted)) {
            if (openOnly) {
                val launchIntent = svc.packageManager.getLaunchIntentForPackage(wanted)
                if (launchIntent != null) {
                    val r = launch(launchIntent, 300)
                    if (r == "ok") return "opened " + labelOf(wanted) + " app"
                }
            } else {
                val i = Intent(android.provider.MediaStore.INTENT_ACTION_MEDIA_PLAY_FROM_SEARCH)
                    .putExtra(android.app.SearchManager.QUERY, query)
                    .putExtra(android.provider.MediaStore.EXTRA_MEDIA_FOCUS, "vnd.android.cursor.item/*")
                    .setPackage(wanted)
                val r = launch(i, 300)
                if (r == "ok") return "playing $query in " + labelOf(wanted)
                val launchIntent = svc.packageManager.getLaunchIntentForPackage(wanted)
                if (launchIntent != null) {
                    val r2 = launch(launchIntent, 300)
                    if (r2 == "ok") return "opened " + labelOf(wanted) + " (play-from-search unavailable for \"" + query + "\")"
                }
            }
        }
        if (openOnly) {
            return "error: no installed music app found (YouTube Music / Spotify). Install one or name the app."
        }
        val v = Intent(Intent.ACTION_VIEW, Uri.parse("https://www.youtube.com/results?search_query=" + Uri.encode(query)))
        if (installed("com.google.android.youtube")) v.setPackage("com.google.android.youtube")
        val r = launch(v, 300)
        return if (r == "ok") "opened YouTube results for $query" else r
    }
'''
              tools.write_text(tt[:m.start()] + new_play + tt[m.end():])
              print("Tools.playMedia patched")
          PY
      - name: Commit
        run: |
          git config user.name orion-bot
          git config user.email orion@users.noreply.github.com
          git add -A
          git diff --cached --quiet && echo no-change && exit 0
          git commit -m "fix: graph fallback + native music app routing"
          git push origin HEAD
